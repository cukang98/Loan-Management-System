name: Deploy to VPS (Develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            
            # Pull latest changes from develop branch
            git pull origin develop
            
            # Rebuild images. Utilizing cache if possible
            docker-compose -f docker-compose.prod.yml build
            
            # Restart containers. The backend container startup command runs prisma migrate deploy automatically
            docker-compose -f docker-compose.prod.yml up -d
            
            # Prune old images to clean up space
            docker image prune -f
